# Monthly source snapshots (Data Center Atlas, DC-1 cadence — Kevin's call 2026-09-02).
#
# Runs on GitHub's infrastructure, not the laptop: no keys needed (ECHO and the
# county GIS are public), and `main` branch protection means each snapshot
# arrives as a reviewable PR rather than a silent push. Vintages are UTC-dated
# by the engine; a re-run in the same month force-updates the same PR branch.
#
# Ingest writes straight into the committed store (`data/`), so merging the PR
# advances the store and `deploy.yml` publishes the result — the cadence loop
# closes without a laptop (decision 2026-09-04). The older `snapshots/` archive
# is superseded by the store's own append-only vintages and is kept only as
# history; nothing writes to it any more.
name: monthly-snapshots

on:
  schedule:
    - cron: "17 9 1 * *" # 1st of each month, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner image ships a current stable Rust toolchain; the build is
      # small enough (~4 deps) that caching isn't worth its complexity monthly.
      - name: Ingest sources into the store
        run: |
          cargo run --release -p bluedot -- ingest echo --out data
          cargo run --release -p bluedot -- ingest pwc --out data

      - name: Open snapshot PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m)"
          branch="snapshot/${stamp}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data
          if git diff --cached --quiet; then
            echo "sources returned byte-identical vintages; nothing to archive"
            exit 0
          fi
          git commit -m "Monthly source snapshots (${stamp})" \
            -m "Automated EPA ECHO (NAICS 518210) + Prince William County pulls into snapshots/. Generated by .github/workflows/snapshot.yml; ingest fails loudly on anything unrecognized, so a green run means the sources still look like themselves."
          git push --force origin "HEAD:refs/heads/${branch}"
          gh pr create --base main --head "$branch" \
            --title "Monthly source snapshots (${stamp})" \
            --body "Automated monthly vintages of the Data Center Atlas sources, ingested straight into the committed store (\`data/entities|claims|geometry\`). Review the diff — new and changed stage claims are the news — and merge: \`deploy.yml\` then rebuilds and publishes the site, so the map's land bays and every dossier advance with this vintage. No local step required." \
            || echo "PR already exists for ${branch} — branch force-updated"
