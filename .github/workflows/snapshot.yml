# Monthly source snapshots (Data Center Atlas, DC-1 cadence — Kevin's call 2026-09-02).
#
# Runs on GitHub's infrastructure, not the laptop: no keys needed (ECHO and the
# county GIS are public), and `main` branch protection means each snapshot
# arrives as a reviewable PR rather than a silent push. Vintages are UTC-dated
# by the engine; a re-run in the same month force-updates the same PR branch.
name: monthly-snapshots

on:
  schedule:
    - cron: "17 9 1 * *" # 1st of each month, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner image ships a current stable Rust toolchain; the build is
      # small enough (~4 deps) that caching isn't worth its complexity monthly.
      - name: Ingest sources into snapshots/
        run: |
          cargo run --release -p bluedot -- ingest echo --out snapshots
          cargo run --release -p bluedot -- ingest pwc --out snapshots

      - name: Open snapshot PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m)"
          branch="snapshot/${stamp}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add snapshots
          if git diff --cached --quiet; then
            echo "sources returned byte-identical snapshots; nothing to archive"
            exit 0
          fi
          git commit -m "Monthly source snapshots (${stamp})" \
            -m "Automated EPA ECHO (NAICS 518210) + Prince William County pulls into snapshots/. Generated by .github/workflows/snapshot.yml; ingest fails loudly on anything unrecognized, so a green run means the sources still look like themselves."
          git push --force origin "HEAD:refs/heads/${branch}"
          gh pr create --base main --head "$branch" \
            --title "Monthly source snapshots (${stamp})" \
            --body "Automated monthly snapshots of the Data Center Atlas sources into \`snapshots/\` — dated vintages of entities + claims, the raw material for pipeline history (plan DC-1). Review the diff (new/changed stage claims are the news) and merge to archive. To fold into a local store: \`cp -n snapshots/entities/* data/entities/ && cp -n snapshots/claims/* data/claims/ && cp -n snapshots/geometry/* data/geometry/\` then \`uv run --project atlas bluedot-atlas build-facts\`." \
            || echo "PR already exists for ${branch} — branch force-updated"
